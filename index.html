<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14284b">

<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: app de una pantalla para celular — encabezado, contenido con scroll, barra de pestañas abajo */
:root{
  --ink:#14284b;--bg:#f3f4f7;--card:#ffffff;--line:#dde1ea;--muted:#5d6782;
  --accent:#f2a516;--accent-ink:#2a1d00;--good:#1f8a4c;--bad:#c7362b;--warn-bg:#fff4dc;
  --font-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --pat:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22 viewBox=%220 0 200 200%22%3E%3Cg fill=%22none%22 stroke=%22%2314284b%22 stroke-opacity=%22.10%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E %3Cpath d=%22M34 18h8v8l5 7v34a4 4 0 0 1-4 4H33a4 4 0 0 1-4-4V33l5-7z%22/%3E%3Cpath d=%22M29 44h18%22/%3E %3Cg transform=%22rotate%28-20 140 40%29%22%3E%3Cpath d=%22M125 40a15 9 0 1 0 30 0a15 9 0 1 0-30 0%22/%3E%3Cpath d=%22M125 40l-10-8v16zM155 40l10-8v16z%22/%3E%3C/g%3E %3Ccircle cx=%22150%22 cy=%22140%22 r=%2212%22/%3E%3Ccircle cx=%22150%22 cy=%22140%22 r=%227%22/%3E%3Ccircle cx=%22168%22 cy=%22122%22 r=%228%22/%3E %3Cellipse cx=%2250%22 cy=%22150%22 rx=%2220%22 ry=%228%22/%3E%3Cpath d=%22M30 150v8c0 4.4 9 8 20 8s20-3.6 20-8v-8%22/%3E %3Cpath d=%22M100 95l3 6 6.5 1-4.7 4.6 1.1 6.4-5.9-3.1-5.9 3.1 1.1-6.4-4.7-4.6 6.5-1z%22/%3E %3Cpath d=%22M92 175h16M100 167v16%22/%3E%3C/g%3E%3C/svg%3E");
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#dfe6f5;--bg:#0f1524;--card:#18203a;--line:#2a3555;--muted:#9aa6c4;
    --accent:#f5b33a;--accent-ink:#241800;--good:#47c07a;--bad:#ff6b5e;--warn-bg:#3a2e12;--pat:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22 viewBox=%220 0 200 200%22%3E%3Cg fill=%22none%22 stroke=%22%23dfe6f5%22 stroke-opacity=%22.09%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E %3Cpath d=%22M34 18h8v8l5 7v34a4 4 0 0 1-4 4H33a4 4 0 0 1-4-4V33l5-7z%22/%3E%3Cpath d=%22M29 44h18%22/%3E %3Cg transform=%22rotate%28-20 140 40%29%22%3E%3Cpath d=%22M125 40a15 9 0 1 0 30 0a15 9 0 1 0-30 0%22/%3E%3Cpath d=%22M125 40l-10-8v16zM155 40l10-8v16z%22/%3E%3C/g%3E %3Ccircle cx=%22150%22 cy=%22140%22 r=%2212%22/%3E%3Ccircle cx=%22150%22 cy=%22140%22 r=%227%22/%3E%3Ccircle cx=%22168%22 cy=%22122%22 r=%228%22/%3E %3Cellipse cx=%2250%22 cy=%22150%22 rx=%2220%22 ry=%228%22/%3E%3Cpath d=%22M30 150v8c0 4.4 9 8 20 8s20-3.6 20-8v-8%22/%3E %3Cpath d=%22M100 95l3 6 6.5 1-4.7 4.6 1.1 6.4-5.9-3.1-5.9 3.1 1.1-6.4-4.7-4.6 6.5-1z%22/%3E %3Cpath d=%22M92 175h16M100 167v16%22/%3E%3C/g%3E%3C/svg%3E");
    color-scheme:dark;
  }
}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
header{background:#14284b;color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:12px}
header h1{font-family:var(--font-display);font-size:26px;margin:0;letter-spacing:.5px;flex:1}
header .date{font-size:13px;opacity:.8}
.icon-btn{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;width:40px;height:40px;display:grid;place-items:center}
.icon-btn[hidden]{display:none}
main{flex:1;overflow-y:auto;padding:16px 16px 24px;background-image:var(--pat);background-size:200px 200px;background-attachment:local}
nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:600;color:var(--muted);position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
.badge[hidden]{display:none}
.badge{position:absolute;top:4px;right:calc(50% - 22px);background:var(--bad);color:#fff;font-size:11px;border-radius:9px;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center}
h2{font-family:var(--font-display);font-size:24px;margin:0;text-wrap:balance}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.banner{background:var(--warn-bg);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
input[type=text],input[type=number],input[type=search],input[type=tel],select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px}
textarea{min-height:120px;font-family:ui-monospace,monospace;font-size:13px}
label{font-size:14px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:4px}
label.check{flex-direction:row;align-items:center;gap:10px;font-weight:500;color:var(--ink)}
label.check input{width:22px;height:22px;flex:none}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:16px;background:var(--line);color:var(--ink);min-height:44px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.dark{background:#14284b;color:#fff}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px;min-height:38px}
.btn[disabled]{opacity:.45}
.btn.icon{padding:0;width:48px;display:grid;place-items:center}
.btn.icon svg{width:24px;height:24px}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.prod{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:92px;position:relative}
.prod:active{transform:scale(.97)}
.prod .name{font-weight:600;line-height:1.2;padding-right:22px}
.prod .price{font-family:var(--font-display);font-size:22px;margin-top:auto}
.prod .qty{position:absolute;top:8px;right:8px;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:10px;min-width:24px;height:24px;display:grid;place-items:center;font-size:14px;padding:0 6px}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:20px;padding:2px 8px;background:var(--line);color:var(--muted);white-space:nowrap}
.pill.low{background:var(--bad);color:#fff}
.pill.ok{background:transparent;border:1px solid var(--line)}
.cartbar{position:sticky;bottom:0;margin:16px -16px -24px;padding:12px 16px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-top:1px solid var(--line)}
.list{display:flex;flex-direction:column}
.list .item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
button.item{background:none;border:0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.grow{flex:1;min-width:0}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:18px}
.tiles{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile .lbl{font-size:13px;color:var(--muted);font-weight:600}
.tile .val{font-family:var(--font-display);font-size:clamp(22px,6vw,28px);line-height:1.1;margin-top:4px}
.tile.big{grid-column:1/-1;background:#14284b;color:#fff;border-color:#14284b}
.tile.big .lbl{color:rgba(255,255,255,.75)}
.tile.big .val{font-size:clamp(30px,9vw,40px)}
.tile.full{grid-column:1/-1}
.pos{color:var(--good)}.neg{color:var(--bad)}
.tile.big .pos{color:#7be3a6}.tile.big .neg{color:#ff9d93}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:8px;border-radius:10px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.methods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.methods button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 4px;font-weight:600;font-size:14px;min-height:44px}
.methods button[aria-pressed="true"]{border-color:var(--accent);background:var(--warn-bg);box-shadow:inset 0 0 0 1px var(--accent)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:4px}
.sheet{position:fixed;inset:0;background:rgba(10,15,30,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet[hidden]{display:none}
.sheet-card{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#14284b;color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.toast[hidden]{display:none}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.searchbar{position:sticky;top:-16px;z-index:5;display:flex;gap:8px;background:transparent;padding:4px 0 6px}
.searchbar input{flex:1}
.strip{display:flex;align-items:center;justify-content:space-between;gap:8px;border-radius:12px;padding:6px 6px 6px 12px;font-size:14px;font-weight:600;background:var(--card);border:1px solid var(--line)}
.strip.open{border-color:var(--good)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:8px;vertical-align:middle}
.strip.open .dot{background:var(--good)}
.calc{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:15px}
.calc .tot{border-top:1px solid var(--line);padding-top:8px;font-weight:700}
.scroll{overflow-x:auto}
table.prev{width:100%;border-collapse:collapse;font-size:13px}
table.prev th,table.prev td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.prev td.n{text-align:right}
/* Escáner con la cámara en vivo */
.scanner{position:fixed;inset:0;background:#000;z-index:40;display:flex;flex-direction:column}
.scanner[hidden]{display:none}
.scanner video{flex:1;width:100%;height:100%;object-fit:cover;min-height:0}
.scan-frame{position:absolute;left:8%;right:8%;top:32%;height:22%;border:3px solid var(--accent);border-radius:14px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45);pointer-events:none}
.scan-frame::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;background:#ff5a4e;box-shadow:0 0 8px #ff5a4e;animation:scanline 1.6s ease-in-out infinite alternate}
@keyframes scanline{from{transform:translateY(-34px)}to{transform:translateY(34px)}}
.scan-top{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;color:#fff;font-weight:600;text-align:center;background:linear-gradient(rgba(0,0,0,.6),transparent)}
.scan-bottom{position:absolute;bottom:0;left:0;right:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:10px;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.qrbox{background:#fff;border-radius:14px;padding:12px;display:grid;place-items:center}
.qrbox img{width:min(240px,70vw);height:auto;image-rendering:pixelated}
ol.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.prod:active{transform:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Mi Negocio</h1>
    <span class="date" id="hdrDate"></span>
    <button class="icon-btn" id="btnInstall" aria-label="Instalar la app" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
    </button>
    <button class="icon-btn" id="btnSettings" aria-label="Ajustes, Excel, compartir y copias de seguridad">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <main id="main"></main>
  <nav class="tabs" aria-label="Secciones">
    <button data-tab="vender"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 3H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>Vender</button>
    <button data-tab="productos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>Productos<span class="badge" id="lowBadge" hidden></span></button>
    <button data-tab="compras"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="7" width="14" height="10" rx="1"/><path d="M15 10h4l3 3v4h-7"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>Compras</button>
    <button data-tab="fiado"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3h12a2 2 0 0 1 2 2v16H7a2 2 0 0 1-2-2z"/><path d="M5 19a2 2 0 0 1 2-2h12M9 7h6M9 11h4"/></svg>Fiado</button>
    <button data-tab="balance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Balance</button>
  </nav>
</div>
<div class="sheet" id="sheet" hidden><div class="sheet-card" id="sheetBody" role="dialog" aria-modal="true"></div></div>
<div class="scanner" id="scanner" hidden role="dialog" aria-modal="true" aria-label="Escanear código de barras">
  <video id="scanVideo" playsinline muted autoplay></video>
  <div class="scan-frame"></div>
  <div class="scan-top" id="scanMsg">Apuntá la cámara al código de barras</div>
  <div class="scan-bottom">
    <button class="btn ghost" id="scanPhoto" style="color:#fff;border-color:rgba(255,255,255,.5)">Sacar foto</button>
    <button class="btn primary" id="scanClose">Cancelar</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
{
/* ---------- Datos ---------- */
const KEY = 'mi-kiosco-v1';
const METHODS = ['Efectivo','Transferencia','Débito','QR / MP','Fiado'];
const PAY_METHODS = ['Efectivo','Transferencia','Débito','QR / MP'];
const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const ZX_URL = 'https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js';
const APP_URL = new URL('./', location.href).href;
let storageOk = true;
let S = null;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function load(){ try{ const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; }catch(e){ storageOk=false; return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ storageOk=false; } }
function emptyData(){ return {products:[], sales:[], purchases:[], expenses:[], customers:[], payments:[], shifts:[], demo:false}; }
function migrate(d){
  for (const k of ['products','sales','purchases','expenses','customers','payments','shifts']) if (!Array.isArray(d[k])) d[k] = [];
  d.products.forEach(p => { if (p.barcode==null) p.barcode=''; if (p.supplier==null) p.supplier=''; });
  return d;
}
/* Pide al navegador que no borre los datos guardados */
try{ if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}

function seed(){
  const P = (name, cost, price, stock, min, supplier) => ({id:uid(), name, cost, price, stock, min, barcode:'', supplier});
  const products = [
    P('Coca-Cola 500 ml', 900, 1400, 24, 6, 'Distribuidora de bebidas'),
    P('Agua mineral 500 ml', 450, 800, 30, 8, 'Distribuidora de bebidas'),
    P('Alfajor triple', 600, 1000, 18, 6, 'Mayorista Don Pepe'),
    P('Chicle menta', 250, 500, 40, 10, 'Mayorista Don Pepe'),
    P('Galletitas dulces', 800, 1300, 12, 4, 'Mayorista Don Pepe'),
    P('Papas fritas chicas', 700, 1200, 3, 5, 'Mayorista Don Pepe'),
    P('Caramelos x10', 200, 400, 50, 10, 'Mayorista Don Pepe'),
    P('Jugo en caja', 500, 900, 15, 5, 'Distribuidora de bebidas'),
    P('Encendedor', 500, 1000, 2, 4, 'Mayorista Don Pepe'),
    P('Turrón', 300, 600, 22, 6, 'Mayorista Don Pepe')
  ];
  const customers = [{id:uid(), name:'Marta (vecina)', phone:''}, {id:uid(), name:'Juan del taller', phone:''}];
  const sales = [], purchases = [], payments = [];
  const now = new Date();
  const mk = (daysAgo, h, m, picks, method, cust) => {
    const d = new Date(now); d.setDate(d.getDate()-daysAgo); d.setHours(h,m,0,0);
    if (d > now) return;
    const items = picks.map(([i,q]) => ({pid:products[i].id, name:products[i].name, qty:q, price:products[i].price, cost:products[i].cost}));
    const s = {id:uid(), ts:d.getTime(), items, method,
      total: items.reduce((a,x)=>a+x.qty*x.price,0), costTotal: items.reduce((a,x)=>a+x.qty*x.cost,0)};
    if (cust){ s.customerId = cust.id; s.customerName = cust.name; }
    sales.push(s);
  };
  mk(0,8,40,[[0,1],[2,1]],'Efectivo');
  mk(0,9,15,[[1,2]],'Transferencia');
  mk(0,10,5,[[3,3],[6,1]],'QR / MP');
  mk(0,11,30,[[4,1],[7,2]],'Débito');
  mk(0,12,50,[[0,2],[5,1]],'Efectivo');
  mk(0,13,20,[[9,2],[2,1]],'Fiado',customers[0]);
  for (let d=1; d<Math.min(now.getDate(),12); d++){
    mk(d,10,0,[[0,3],[2,2],[1,2]],'Efectivo');
    mk(d,17,30,[[4,1],[5,2],[7,1]],d%2?'Transferencia':'Efectivo');
    if (d%3===0) mk(d,19,10,[[8,1],[3,4]],'Débito');
    if (d===2) mk(d,18,0,[[0,2],[4,1]],'Fiado',customers[1]);
  }
  const pt = new Date(now); pt.setDate(pt.getDate()-1); pt.setHours(20,0,0,0);
  payments.push({id:uid(), ts:pt.getTime(), customerId:customers[1].id, amount:2000, method:'Efectivo'});
  const pd = new Date(now); pd.setDate(Math.max(1, now.getDate()-2)); pd.setHours(7,30,0,0);
  if (pd <= now) purchases.push({id:uid(), ts:pd.getTime(), supplier:'Mayorista Don Pepe', fromCash:true,
    items:[{pid:products[0].id,name:products[0].name,qty:24,cost:900},{pid:products[2].id,name:products[2].name,qty:20,cost:600}],
    total: 24*900+20*600});
  const expenses = [{id:uid(), ts:Date.now()-3600000, amount:1500, note:'Bolsas'}];
  return {products, sales, purchases, expenses, customers, payments, shifts:[], demo:true};
}

/* ---------- Código de barras ---------- */
const BC_FORMATS = ['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','codabar','qr_code'];
let nativeDetector;
async function getNativeDetector(){
  if (nativeDetector !== undefined) return nativeDetector;
  nativeDetector = null;
  if ('BarcodeDetector' in window){
    try{
      const sup = BarcodeDetector.getSupportedFormats ? await BarcodeDetector.getSupportedFormats() : BC_FORMATS;
      const f = BC_FORMATS.filter(x => sup.includes(x));
      if (f.length) nativeDetector = new BarcodeDetector({formats:f});
    }catch(e){ nativeDetector = null; }
  }
  return nativeDetector;
}
function zxHints(){ const h = new Map(); h.set(ZXing.DecodeHintType.TRY_HARDER, true); return h; }
async function decodeBarcode(file){
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 1400/Math.max(bmp.width,bmp.height));
  const c = document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  const det = await getNativeDetector();
  if (det){ try{ const r = await det.detect(c); if (r.length) return r[0].rawValue; }catch(e){} }
  await loadScript(ZX_URL);
  try{ const r = await new ZXing.BrowserMultiFormatReader(zxHints()).decodeFromImageUrl(c.toDataURL('image/jpeg',.92)); return r.getText(); }
  catch(e){ return null; }
}
/* Abre la cámara en vivo y devuelve el código leído (o null si se cancela). Debe llamarse desde un toque. */
function scan(){
  return new Promise(resolve => {
    const ov = $('scanner'), video = $('scanVideo'), msg = $('scanMsg');
    let done = false, stream = null, timer = 0;
    const finish = code => {
      if (done) return; done = true; clearTimeout(timer);
      if (stream) stream.getTracks().forEach(t => t.stop());
      video.srcObject = null; ov.hidden = true;
      if (code){ try{ navigator.vibrate && navigator.vibrate(80); }catch(e){} }
      resolve(code ? String(code).trim() : null);
    };
    ov.hidden = false; msg.textContent = 'Abriendo la cámara…';
    $('scanClose').onclick = () => finish(null);
    $('scanPhoto').onclick = async () => {
      const f = await pickFile('image/*','environment'); if (!f || done) return;
      msg.textContent = 'Leyendo la foto…';
      const c = await decodeBarcode(f).catch(() => null);
      if (c) finish(c); else msg.textContent = 'No se pudo leer la foto. Probá más cerca, derecha y con luz.';
    };
    (async () => {
      if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){ msg.textContent = 'Este navegador no deja usar la cámara en vivo. Tocá "Sacar foto".'; return; }
      try{
        stream = await navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720}}});
      }catch(e){ msg.textContent = 'No se pudo abrir la cámara. Dale permiso a la app o tocá "Sacar foto".'; return; }
      if (done){ stream.getTracks().forEach(t => t.stop()); return; }
      video.srcObject = stream;
      try{ await video.play(); }catch(e){}
      msg.textContent = 'Apuntá al código de barras y mantené quieto el celular';
      const det = await getNativeDetector();
      let zxReader = null; const cv = document.createElement('canvas'); const ctx = cv.getContext('2d', {willReadFrequently:true});
      if (!det){
        try{ await loadScript(ZX_URL); zxReader = new ZXing.MultiFormatReader(); zxReader.setHints(zxHints()); }
        catch(e){ msg.textContent = 'Sin internet no se puede cargar el lector. Tocá "Sacar foto".'; }
      }
      const tick = async () => {
        if (done) return;
        if (video.readyState >= 2 && video.videoWidth){
          try{
            if (det){
              const r = await det.detect(video); if (r.length){ finish(r[0].rawValue); return; }
            } else if (zxReader){
              /* Recorta la franja del medio (donde está el recuadro) para leer más rápido */
              const vw = video.videoWidth, vh = video.videoHeight, sh = Math.round(vh*0.5), sy = Math.round((vh-sh)/2);
              const k = Math.min(1, 1000/vw); cv.width = Math.round(vw*k); cv.height = Math.round(sh*k);
              ctx.drawImage(video, 0, sy, vw, sh, 0, 0, cv.width, cv.height);
              const lum = new ZXing.HTMLCanvasElementLuminanceSource(cv);
              const res = zxReader.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(lum)));
              if (res){ finish(res.getText()); return; }
            }
          }catch(e){ /* todavía no encontró código */ }
        }
        timer = setTimeout(tick, det ? 150 : 220);
      };
      tick();
    })();
  });
}

const PUB_KEY = {"kty":"EC","crv":"P-256","x":"vJv2QxlGnLlFsAEDAg41nRBLAfukhNP--rYtu3mUTNc","y":"_f7fw4QUMJceOA815VWWh5QpCwboleEWdy9EqRqHFe8","ext":true,"key_ops":["verify"]};
const DEV_KEY = 'mi-negocio-equipo', LIC_KEY = 'mi-negocio-licencia';

function deviceId(){
  let id = null; try{ id = localStorage.getItem(DEV_KEY); }catch(e){}
  if (!id){
    const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', r = new Uint32Array(8); crypto.getRandomValues(r);
    const s = Array.from(r, x => A[x % A.length]).join(''); id = s.slice(0,4) + '-' + s.slice(4);
    try{ localStorage.setItem(DEV_KEY, id); }catch(e){}
  }
  return id;
}
function b64uToBytes(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function checkCode(code){
  try{
    const clean = String(code||'').replace(/^MN-/i,'').replace(/[^A-Za-z0-9_-]/g,'');
    const sig = b64uToBytes(clean); if (sig.length !== 64) return false;
    const key = await crypto.subtle.importKey('jwk', PUB_KEY, {name:'ECDSA', namedCurve:'P-256'}, false, ['verify']);
    return await crypto.subtle.verify({name:'ECDSA', hash:'SHA-256'}, key, sig, new TextEncoder().encode('MN1:' + deviceId()));
  }catch(e){ return false; }
}

function shiftCalc(sh, until){
  const inR = ts => ts>=sh.openTs && ts<=until;
  const ventasEf = sum(S.sales.filter(s=>inR(s.ts) && s.method==='Efectivo'), s=>s.total);
  const cobrosEf = sum(S.payments.filter(p=>inR(p.ts) && p.method==='Efectivo'), p=>p.amount);
  const gastos = sum(S.expenses.filter(x=>inR(x.ts)), x=>x.amount);
  const compras = sum(S.purchases.filter(c=>inR(c.ts) && c.fromCash), c=>c.total);
  const otros = sum(S.sales.filter(s=>inR(s.ts) && s.method!=='Efectivo' && s.method!=='Fiado'), s=>s.total);
  const fiado = sum(S.sales.filter(s=>inR(s.ts) && s.method==='Fiado'), s=>s.total);
  return {ventasEf, cobrosEf, gastos, compras, otros, fiado, expected: sh.openAmount + ventasEf + cobrosEf - gastos - compras};
}

  if (pc){ pc.value = prev; const upd=()=>{ const v=num(pc.value); const d=v-cartTotal(); $('vuelto').textContent = pc.value==='' ? '—' : (d<0 ? 'Falta '+money(-d) : money(d)); $('vuelto').className='val num '+(d<0&&pc.value!==''?'neg':''); }; pc.oninput=upd; upd(); }
  const fc = $('fiCust'); if (fc) fc.onchange = () => { fiCust = fc.value; refreshCartSheet(); if (fiCust==='__new') setTimeout(()=>{ const n=$('fiNew'); if(n) n.focus(); },60); };
  const fn = $('fiNew'); if (fn) fn.oninput = () => { fiNew = fn.value; };

function checkout(){
  let cust = null;
  if (method==='Fiado'){
    if (fiCust==='__new'){ const name = fiNew.trim(); if (!name){ toast('Poné el nombre del cliente'); return; }
      cust = {id:uid(), name, phone:''}; S.customers.push(cust); }
    else { cust = custById(fiCust); if (!cust){ toast('Elegí a quién se le fía'); return; } }
  }
  const items = Object.entries(cart).map(([id,q]) => { const p=prodById(id); return p ? {pid:id, name:p.name, qty:q, price:p.price, cost:p.cost} : null; }).filter(Boolean)
    .concat(free.map(f => ({pid:null, name:f.name, qty:f.qty, price:f.price, cost:f.cost})));
  const sale = {id:uid(), ts:Date.now(), items, method,
    total: sum(items, x=>x.qty*x.price), costTotal: sum(items, x=>x.qty*x.cost)};
  if (cust){ sale.customerId = cust.id; sale.customerName = cust.name; }
  items.forEach(x => { const p = x.pid && prodById(x.pid); if (p) p.stock -= x.qty; });
  S.sales.push(sale); save();
  cart = {}; free = []; method='Efectivo'; fiCust=''; fiNew=''; closeSheet(); render();
  toast(cust ? 'Fiado anotado a ' + cust.name + ': ' + money(sale.total) : 'Venta registrada: ' + money(sale.total));
}

function pnum(v){
  if (typeof v==='number') return v;
  let s = String(v).replace(/[$\s]/g,''); if (!s) return 0;
  if (s.includes(',') && s.includes('.')) s = s.replace(/\./g,'').replace(',','.');
  else if (s.includes(',')) s = s.replace(',','.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  return num(s);
}
function parseRows(rows){
  const H = {cost:/costo/, min:/(minimo|aviso|avisar)/, barcode:/(codigo|barra|ean)/, supplier:/(proveedor|mayorista|distribuidor)/, stock:/(stock|cantidad|existencia)/, name:/^(nombre|producto|descripcion|articulo|detalle)/, price:/(precio|venta|pvp)/};
  let start = 0, map = null;
  for (let r=0; r<Math.min(rows.length,8); r++){
    const m = {};
    (rows[r]||[]).forEach((cell,i) => { const h = norm(cell).trim(); if (!h) return;
      for (const k of Object.keys(H)) if (m[k]==null && H[k].test(h)){ m[k]=i; break; } });
    if (m.name!=null){ map = m; start = r+1; break; }
  }
  if (!map) map = {name:0, cost:1, price:2, stock:3};
  const get = (row,k) => map[k]==null ? '' : row[map[k]];
  const out = [];
  for (let r=start; r<rows.length; r++){
    const row = rows[r]||[]; const name = String(get(row,'name')).trim(); if (!name) continue;
    let code = get(row,'barcode'); code = typeof code==='number' ? String(Math.round(code)) : String(code).trim();
    out.push({name, cost:pnum(get(row,'cost')), price:pnum(get(row,'price')),
      stock: map.stock==null || get(row,'stock')==='' ? null : Math.round(pnum(get(row,'stock'))),
      min: map.min==null || get(row,'min')==='' ? null : Math.round(pnum(get(row,'min'))),
      barcode:code, supplier:String(get(row,'supplier')).trim()});
  }
  return out;
}
const findExisting = it => (it.barcode && prodByCode(it.barcode)) || S.products.find(p => norm(p.name).trim()===norm(it.name).trim());

    <div class="tiles"><div class="tile big"><div class="lbl">${s>0?'Debe':s<0?'Tiene a favor':'Está al día'}</div><div class="val num">${money(Math.abs(s))}</div></div></div>
    <form class="card stack" id="payForm" style="gap:10px"><b>Registrar un pago</b>
      <div class="row" style="align-items:flex-end"><label for="payAmt" class="grow">Monto que pagó<input type="number" inputmode="decimal" step="any" id="payAmt" placeholder="0"></label>
        <button class="btn ghost" type="button" id="payAll" ${s>0?'':'disabled'}>Pagó todo</button></div>
      <div class="methods">${PAY_METHODS.map(m=>`<button type="button" data-paym="${m}" aria-pressed="${m===payMethod}">${m}</button>`).join('')}</div>
      <button class="btn primary block" type="submit">Guardar pago</button></form>
    ${moves.length ? `<button class="btn dark block" id="custMsg">Copiar el detalle para mandarle por WhatsApp</button>` : ''}
    <div class="card"><b>Movimientos</b>${moves.length ? `<div class="list">${moves.map(m => `
      <div class="item"><span class="small muted num" style="width:44px">${ddmm(m.ts)}</span><div class="grow small">${esc(m.desc)}</div>
      <b class="num ${m.t==='f'?'neg':'pos'}">${m.t==='f'?'+':'−'}${money(m.amt)}</b>
      ${m.t==='p' ? `<button class="btn sm ghost" data-act="delPay" data-id="${m.id}" data-c="${id}" aria-label="Anular pago">Anular</button>` : ''}</div>`).join('')}</div>` : `<div class="small muted">Sin movimientos todavía.</div>`}</div>
    <button class="btn ghost block" data-act="close">Cerrar</button></div>`);
  if ($('payAll')) $('payAll').onclick = () => { $('payAmt').value = Math.round(s*100)/100; };
  document.querySelectorAll('[data-paym]').forEach(b => b.onclick = () => { payMethod = b.dataset.paym;
    document.querySelectorAll('[data-paym]').forEach(x => x.setAttribute('aria-pressed', x.dataset.paym===payMethod)); });
  $('payForm').onsubmit = e => { e.preventDefault(); const a = num($('payAmt').value);
    if (a<=0){ toast('Poné el monto que pagó'); return; }
    S.payments.push({id:uid(), ts:Date.now(), customerId:id, amount:a, method:payMethod}); save(); render(); custSheet(id);
    toast('Pago de ' + money(a) + ' guardado'); };
  if ($('custMsg')) $('custMsg').onclick = async () => {
    const lines = [...moves].reverse().slice(-20).map(m => `${ddmm(m.ts)}  ${m.t==='f' ? 'Fiado ' + money(m.amt) + ' (' + m.desc + ')' : 'Pago ' + money(m.amt)}`);
    const txt = `Hola ${c.name}! Te paso el detalle de tu cuenta:\n\n${lines.join('\n')}\n\n${s>0 ? 'Total que debés: ' + money(s) : s<0 ? 'Tenés a favor: ' + money(-s) : 'Estás al día.'}\n¡Gracias!`;
    try{ await navigator.clipboard.writeText(txt); toast('Copiado. Pegalo en WhatsApp.'); }
    catch(e){ openSheet(`<div class="stack"><h2>Detalle para enviar</h2><textarea id="msgTxt" readonly>${esc(txt)}</textarea><p class="small muted" style="margin:0">Mantené apretado el texto para copiarlo.</p><button class="btn ghost block" data-act="openCust" data-id="${id}">Volver</button></div>`); $('msgTxt').select(); }
  };
}
function custForm(c){
  const isNew = !c; c = c || {name:'', phone:''};
  const s = isNew ? 0 : saldo(c);
  openSheet(`<form class="stack" id="cuForm"><h2>${isNew?'Nuevo cliente':'Editar cliente'}</h2>
    <label for="cuName">Nombre<input type="text" id="cuName" value="${esc(c.name)}" placeholder="Ej: Marta (vecina)"></label>
    <label for="cuPhone">Teléfono (opcional)<input type="tel" id="cuPhone" value="${esc(c.phone)}" placeholder="Ej: 11 2345 6789"></label>
    <button class="btn primary block" type="submit">Guardar</button>
    ${isNew ? '' : `<button class="btn danger block" type="button" id="cuDel">Eliminar cliente</button>`}
    <button class="btn ghost block" type="button" ${isNew?'data-act="close"':`data-act="openCust" data-id="${c.id}"`}>Cancelar</button></form>`);
  $('cuForm').onsubmit = e => { e.preventDefault(); const name = $('cuName').value.trim();
    if (!name){ toast('Poné el nombre'); return; }
    if (isNew){ const n = {id:uid(), name, phone:$('cuPhone').value.trim()}; S.customers.push(n); save(); render(); custSheet(n.id); toast('Cliente agregado'); }
    else { c.name = name; c.phone = $('cuPhone').value.trim(); S.sales.forEach(x => { if (x.customerId===c.id) x.customerName = name; }); save(); render(); custSheet(c.id); toast('Cambios guardados'); } };
  if (!isNew) $('cuDel').onclick = () => {
    if (Math.abs(s) >= 0.01){ toast('No se puede eliminar: todavía tiene saldo de ' + money(Math.abs(s))); return; }
    confirmSheet('¿Eliminar cliente?', `Se borra “${c.name}” y sus pagos registrados. Las ventas pasadas quedan en el balance.`, 'Eliminar', () => {
      S.customers = S.customers.filter(x=>x.id!==c.id); S.payments = S.payments.filter(p=>p.customerId!==c.id); save(); render(); toast('Cliente eliminado'); }); };
  setTimeout(() => { const a=$('cuName'); if(a && isNew) a.focus(); }, 60);
}

/* ---------- Balance ---------- */
function inPeriod(ts){ const d=new Date(ts); return period==='day' ? sameDay(d,ref) : sameMonth(d,ref); }
function viewBalance(){
  const sales = S.sales.filter(s=>inPeriod(s.ts));
  const purch = S.purchases.filter(c=>inPeriod(c.ts));
  const ventas = sum(sales, s=>s.total);
  const costo = sum(sales, s=>s.costTotal);
  const ganancia = ventas - costo;
  const compras = sum(purch, c=>c.total);
  const exps = S.expenses.filter(x=>inPeriod(x.ts)).sort((a,b)=>b.ts-a.ts);
  const gastos = sum(exps, x=>x.amount);
  const fiado = sum(sales.filter(s=>s.method==='Fiado'), s=>s.total);
  const pays = S.payments.filter(p=>inPeriod(p.ts)).sort((a,b)=>b.ts-a.ts);
  const cobros = sum(pays, p=>p.amount);
  const neto = ventas - fiado + cobros - compras - gastos;
  const closes = S.shifts.filter(x=>x.closeTs && inPeriod(x.closeTs)).sort((a,b)=>b.closeTs-a.closeTs);
  const when = ts => period==='day' ? hhmm(ts) : ddmm(ts);
  const expList = `<div class="card"><div class="row between" style="margin-bottom:4px"><b>Gastos de caja (${exps.length})</b><button class="btn sm ghost" data-act="newExpense">+ Anotar</button></div>${exps.length ? `<div class="list">${exps.map(x => `
    <div class="item"><span class="small muted num" style="width:44px">${when(x.ts)}</span><div class="grow small">${esc(x.note)}</div>
    <b class="num neg">−${money(x.amount)}</b><button class="btn sm ghost" data-act="delExpense" data-id="${x.id}" aria-label="Anular gasto">Anular</button></div>`).join('')}</div>` : `<div class="small muted">Sin gastos en este período.</div>`}</div>`;
  const byMethod = {}; sales.forEach(s => byMethod[s.method]=(byMethod[s.method]||0)+s.total);
  const byProd = {}; sales.forEach(s => s.items.forEach(i => { byProd[i.name]=byProd[i.name]||{q:0,t:0}; byProd[i.name].q+=i.qty; byProd[i.name].t+=i.qty*i.price; }));
  const top = Object.entries(byProd).sort((a,b)=>b[1].q-a[1].q).slice(0,5);
  const topMax = top.length ? top[0][1].q : 1;
  const now = new Date();
  const isCurrent = period==='day' ? sameDay(ref,now) : sameMonth(ref,now);
  const label = period==='day'
    ? (isCurrent ? 'Hoy' : ref.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'}))
    : ref.toLocaleDateString('es-AR',{month:'long',year:'numeric'});

  let days = '';
  if (period==='month'){
    const map = {}; sales.forEach(s => { const d=new Date(s.ts).getDate(); map[d]=(map[d]||0)+s.total; });
    const entries = Object.entries(map).sort((a,b)=>b[0]-a[0]); const mx = Math.max(1,...Object.values(map));
    days = entries.length ? `<div class="card"><div style="font-weight:700;margin-bottom:8px">Ventas por día</div><div class="stack" style="gap:8px">${entries.map(([d,t]) => `
      <button data-act="goDay" data-d="${d}" style="background:none;border:0;padding:0;text-align:left;display:grid;grid-template-columns:44px 1fr 96px;gap:8px;align-items:center">
        <span class="small muted num">${d}/${ref.getMonth()+1}</span><span class="bar"><span style="width:${t/mx*100}%"></span></span><span class="num small" style="text-align:right;font-weight:600">${money(t)}</span></button>`).join('')}</div></div>` : '';
  }
  const salesList = period==='day' && sales.length ? `<div class="card"><div style="font-weight:700;margin-bottom:4px">Ventas del día (${sales.length})</div><div class="list">${[...sales].sort((a,b)=>b.ts-a.ts).map(s => `
    <div class="item"><span class="small muted num" style="width:44px">${hhmm(s.ts)}</span><div class="grow small">${s.items.map(i=>esc(i.qty+'× '+i.name)).join(', ')}<div class="muted">${esc(s.method)}${s.customerName?' · '+esc(s.customerName):''}</div></div>
    <b class="num">${money(s.total)}</b><button class="btn sm ghost" data-act="delSale" data-id="${s.id}" aria-label="Anular venta">Anular</button></div>`).join('')}</div></div>` : '';
  const closeList = closes.length ? `<div class="card"><div style="font-weight:700;margin-bottom:4px">Cierres de caja (${closes.length})</div><div class="list">${closes.map(x => `
    <div class="item"><span class="small muted num" style="width:44px">${when(x.closeTs)}</span><div class="grow small">Contado ${money(x.counted)} · debía haber ${money(x.expected)}${x.note?`<div class="muted">${esc(x.note)}</div>`:''}</div>
    <b class="num ${Math.abs(x.diff)<0.01?'':x.diff>0?'pos':'neg'}">${Math.abs(x.diff)<0.01?'Justo':(x.diff>0?'+':'−')+money(Math.abs(x.diff))}</b></div>`).join('')}</div></div>` : '';

  return `<div class="stack">${demoBanner()}
    <div class="seg"><button data-act="period" data-p="day" aria-pressed="${period==='day'}">Día</button><button data-act="period" data-p="month" aria-pressed="${period==='month'}">Mes</button></div>
    <div class="row between"><button class="btn sm ghost" data-act="prev" aria-label="Anterior">‹</button><h2 style="text-transform:capitalize;font-size:22px">${esc(label)}</h2><button class="btn sm ghost" data-act="next" aria-label="Siguiente" ${isCurrent?'disabled':''}>›</button></div>
    <div class="tiles">
      <div class="tile big"><div class="lbl">Ganancia (ventas menos costo de lo vendido)</div><div class="val num ${ganancia>=0?'pos':'neg'}">${money(ganancia)}</div><div class="small" style="opacity:.75;margin-top:4px">${sales.length} venta${sales.length===1?'':'s'}${ventas>0?` · margen ${Math.round(ganancia/ventas*100)}%`:''}${gastos>0?` · después de gastos ${money(ganancia-gastos)}`:''}</div></div>
      <div class="tile"><div class="lbl">Vendido</div><div class="val num">${money(ventas)}</div></div>
      <div class="tile"><div class="lbl">Costo de lo vendido</div><div class="val num">${money(costo)}</div></div>
      <div class="tile"><div class="lbl">Compras al mayorista</div><div class="val num">${money(compras)}</div></div>
      <div class="tile"><div class="lbl">Gastos de caja</div><div class="val num">${money(gastos)}</div></div>
      <div class="tile"><div class="lbl">Vendido fiado</div><div class="val num">${money(fiado)}</div></div>
      <div class="tile"><div class="lbl">Cobros de fiado</div><div class="val num">${money(cobros)}</div></div>
      <div class="tile full"><div class="lbl">Plata neta (lo cobrado − compras − gastos)</div><div class="val num ${neto>=0?'pos':'neg'}">${money(neto)}</div></div>
    </div>
    ${sales.length || cobros ? `<div class="card"><div style="font-weight:700;margin-bottom:8px">Por forma de pago</div><div class="stack" style="gap:6px">${METHODS.map(m => `<div class="row between small"><span>${m}</span><b class="num">${money(byMethod[m]||0)}</b></div>`).join('')}
      ${cobros ? `<div class="row between small muted"><span>+ cobros de fiado</span><b class="num">${money(cobros)}</b></div>` : ''}</div></div>` : ''}
    ${sales.length ? `<div class="card"><div style="font-weight:700;margin-bottom:8px">Lo más vendido</div><div class="stack" style="gap:8px">${top.map(([n,v]) => `
      <div><div class="row between small"><span>${esc(n)}</span><span class="num muted">${v.q} u. · ${money(v.t)}</span></div><div class="bar" style="margin-top:4px"><span style="width:${v.q/topMax*100}%"></span></div></div>`).join('')}</div></div>` : `<div class="empty">No hay ventas en este período.</div>`}
    ${days}${salesList}${closeList}${expList}
    <button class="btn ghost block" data-act="exportX">Bajar todo a Excel</button>
  </div>`;
}

/* ---------- Ajustes / copia de seguridad ---------- */
function validBackup(d){ return d && Array.isArray(d.products) && Array.isArray(d.sales) && Array.isArray(d.purchases); }
function askRestore(d){
  confirmSheet('¿Restaurar esta copia?', 'Los datos actuales se reemplazan por los de la copia.', 'Restaurar', () => { S = migrate(d); save(); cart={}; free=[]; render(); toast('Datos restaurados'); });
}
function settingsSheet(){
  openSheet(`<div class="stack">
    <h2>La app</h2>
    ${isStandalone() ? '' : `<button class="btn primary block" id="stInstall">Instalar en este celular</button>`}
    <button class="btn dark block" id="stShare">Compartir la app (código QR)</button>
    <div class="strip ${licensed?'open':''}"><span><span class="dot"></span>${licensed ? 'Versión completa' : `Versión gratis · ${Math.min(S.products.length,FREE_MAX)} de ${FREE_MAX} productos`}</span><button class="btn sm ${licensed?'ghost':'primary'}" data-act="license">${licensed?'Ver':'Activar'}</button></div>
    <hr style="border:0;border-top:1px solid var(--line);width:100%">
    <h2>Excel</h2>
    <button class="btn dark block" id="xExp">Bajar todo a Excel</button>
    <div class="two"><button class="btn ghost" id="xImp">Importar productos</button><button class="btn ghost" id="xTpl">Planilla modelo</button></div>
    <p class="muted small" style="margin:0">La planilla modelo tiene las columnas que la app entiende: Nombre, Costo, Precio venta, Stock, Avisar con menos de, Código de barras y Proveedor.</p>
    <hr style="border:0;border-top:1px solid var(--line);width:100%">
    <h2>Copia de seguridad</h2>
    <p class="muted small" style="margin:0">Los datos se guardan solo en este celular. Bajá una copia de vez en cuando y guardala en un chat o en Drive, por si cambiás de teléfono o se borra el navegador.</p>
    <div class="two"><button class="btn dark" id="bkFile">Bajar copia</button><button class="btn ghost" id="bkCopy">Copiar como texto</button></div>
    <button class="btn ghost block" id="bkOpen">Restaurar desde un archivo de copia</button>
    <label for="bkText">O pegá acá una copia en texto<textarea id="bkText" placeholder="Pegá el texto de la copia…"></textarea></label>
    <button class="btn ghost block" id="bkRestore">Restaurar desde el texto</button>
    <hr style="border:0;border-top:1px solid var(--line);width:100%">
    <button class="btn danger block" id="bkWipe">Borrar todos los datos</button>
    <button class="btn ghost block" data-act="close">Cerrar</button>
  </div>`);
  if ($('stInstall')) $('stInstall').onclick = doInstall;
  $('stShare').onclick = shareSheet;
  $('xExp').onclick = exportExcel;
  $('xImp').onclick = importExcel;
  $('xTpl').onclick = downloadTemplate;
  $('bkFile').onclick = () => saveFile(`copia-mi-negocio-${stamp()}.json`, JSON.stringify(S));
  $('bkCopy').onclick = async () => { const txt = JSON.stringify(S);
    try{ await navigator.clipboard.writeText(txt); toast('Copia copiada. Pegala en un lugar seguro.'); }
    catch(e){ $('bkText').value = txt; $('bkText').select(); toast('Seleccioná el texto y copialo a mano'); } };
  $('bkOpen').onclick = () => { pickFile('.json,application/json,text/plain').then(async f => { if (!f) return;
    try{ const d = JSON.parse(await f.text()); if (!validBackup(d)) throw 0; askRestore(d); }catch(e){ toast('Ese archivo no es una copia válida'); } }); };
  $('bkRestore').onclick = () => { try{ const d = JSON.parse($('bkText').value); if (!validBackup(d)) throw 0; askRestore(d); }
    catch(e){ toast('Ese texto no es una copia válida'); } };
  $('bkWipe').onclick = () => confirmSheet('¿Borrar todo?', 'Se eliminan productos, ventas, compras, fiados y cierres de este celular. No se puede deshacer.', 'Borrar todo', () => {
    S = emptyData(); cart={}; free=[]; save(); render(); toast('Datos borrados'); });
}
$('btnSettings').onclick = settingsSheet;

/* ---------- Acciones (un solo manejador) ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch(a){
    case 'close': closeSheet(); if (tab==='vender') renderGrid(); break;
    case 'install': doInstall(); break;
    case 'license': licenseSheet(); break;
    case 'hideInstall': try{ localStorage.setItem(hideInstallKey,'1'); }catch(e){} render(); toast('Podés instalarla después con el botón de arriba'); break;
    case 'add': { const p = prodById(id); if (p){ cart[id]=(cart[id]||0)+1; renderGrid(); } } break;
    case 'clearCart': cart={}; free=[]; renderGrid(); break;
    case 'openCart': refreshCartSheet(); break;
    case 'inc': cart[id]++; refreshCartSheet(); break;
    case 'dec': cart[id]--; if (cart[id]<=0) delete cart[id]; refreshCartSheet(); break;
    case 'rmFree': free = free.filter(f=>f.key!==el.dataset.k); refreshCartSheet(); break;
    case 'method': method=el.dataset.m; refreshCartSheet(); break;
    case 'checkout': checkout(); break;
    case 'varios': variosSheet(); break;
    case 'scanSell': scan().then(code => { if (!code) return; const p = prodByCode(code); if (p) addToCart(p); else unknownCodeSheet(code); }); break;
    case 'scanFind': scan().then(code => { if (!code) return; const p = prodByCode(code); if (p) prodSheet(p); else unknownCodeSheet(code); }); break;
    case 'clearQ': { query=''; const q=$('q'); if(q){ q.value=''; q.focus(); } el.hidden=true; renderGrid(); } break;
    case 'openShift': openShiftSheet(); break;
    case 'closeShift': closeShiftSheet(); break;
    case 'newExpense': expenseSheet(); break;
    case 'delExpense': confirmSheet('¿Anular gasto?', 'Se borra este gasto y la plata vuelve a contar en la caja.', 'Anular gasto', () => {
        S.expenses = S.expenses.filter(x=>x.id!==id); save(); render(); toast('Gasto anulado'); }); break;
    case 'goProductos': setTab('productos'); break;
    case 'newProd': prodSheet(null); break;
    case 'editProd': prodSheet(prodById(id)); break;
    case 'raise': raiseSheet(); break;
    case 'undoRaise': if (lastRaise){ lastRaise.forEach(o => { const p=prodById(o.id); if (p){ p.price=o.price; p.cost=o.cost; } }); lastRaise=null; save(); render(); toast('Precios como estaban antes'); } break;
    case 'importX': importExcel(); break;
    case 'exportX': exportExcel(); break;
    case 'newPurchase': pLines=[]; purchaseSheet._sup=''; purchaseSheet._cash=true; purchaseSheet(); break;
    case 'rmLine': pLines.splice(+el.dataset.i,1); purchaseSheet._sup=$('puSup').value; purchaseSheet._cash=$('puCash').checked; purchaseSheet(); break;
    case 'savePurchase': savePurchase(); break;
    case 'delPurchase': confirmSheet('¿Anular compra?', 'Se quita la compra y se resta del stock lo que habías sumado.', 'Anular compra', () => {
        const c = S.purchases.find(x=>x.id===id); if(!c) return; c.items.forEach(i => { const p=prodById(i.pid); if(p) p.stock -= i.qty; });
        S.purchases = S.purchases.filter(x=>x.id!==id); save(); render(); toast('Compra anulada'); }); break;
    case 'delSale': confirmSheet('¿Anular venta?', 'Se borra la venta y los productos vuelven al stock. Si era fiado, se le descuenta al cliente.', 'Anular venta', () => {
        const s = S.sales.find(x=>x.id===id); if(!s) return; s.items.forEach(i => { const p=i.pid && prodById(i.pid); if(p) p.stock += i.qty; });
        S.sales = S.sales.filter(x=>x.id!==id); save(); render(); toast('Venta anulada'); }); break;
    case 'newCust': custForm(null); break;
    case 'openCust': custSheet(id); break;
    case 'editCust': custForm(custById(id)); break;
    case 'delPay': { const cid = el.dataset.c; confirmSheet('¿Anular pago?', 'Se borra este pago y vuelve a sumarse a la deuda del cliente.', 'Anular pago', () => {
        S.payments = S.payments.filter(p=>p.id!==id); save(); render(); custSheet(cid); toast('Pago anulado'); }); } break;
    case 'period': period=el.dataset.p; ref=new Date(); render(); break;
    case 'prev': if (period==='day') ref.setDate(ref.getDate()-1); else { ref.setDate(1); ref.setMonth(ref.getMonth()-1); } ref=new Date(ref); render(); break;
    case 'next': if (period==='day') ref.setDate(ref.getDate()+1); else { ref.setDate(1); ref.setMonth(ref.getMonth()+1); } ref=new Date(ref); render(); break;
    case 'goDay': period='day'; ref=new Date(ref.getFullYear(), ref.getMonth(), +el.dataset.d); render(); $('main').scrollTop=0; break;
    case 'clearDemo': confirmSheet('¿Empezar de cero?', 'Se borran los productos, ventas y clientes de ejemplo para que cargues los tuyos.', 'Borrar ejemplos', () => {
        S = emptyData(); cart={}; free=[]; save(); setTab('productos'); toast('Listo, cargá tus productos'); }); break;
  }
});

/* ---------- Inicio ---------- */
S = migrate(load() || seed());
save();
deviceId();
updInstallBtn();
setTab('vender');
loadLicense().then(() => { if (licensed) render(); });

/* Funciona sin internet y avisa cuando hay versión nueva */
if ('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing; if (!nw) return;
        nw.addEventListener('statechange', () => {
          if (nw.state==='installed' && navigator.serviceWorker.controller) toast('Hay una versión nueva. Cerrá y abrí la app para usarla.');
        });
      });
    }).catch(() => {});
  });
}
}
</script>
</body>
</html>
